
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login | Nuur Elites</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f7f2;
      color: #26352b;
    }

    .login-container {
      width: 100%;
      max-width: 430px;
      background: #fff;
      padding: 35px 30px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.09);
    }

    .logo {
      display: block;
      width: 105px;
      height: 105px;
      object-fit: contain;
      margin: 0 auto 15px;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    h1 {
      color: #155b37;
      font-size: 25px;
      margin: 8px 0;
    }

    header p {
      color: #777;
      font-size: 14px;
      line-height: 1.6;
    }

    .admin-label {
      display: inline-block;
      background: #eaf4ee;
      color: #155b37;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 8px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 18px 0 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #155b37;
      box-shadow: 0 0 0 2px rgba(21,91,55,0.1);
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      border: none;
      border-radius: 6px;
      background: #155b37;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #10452b;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #loginMessage {
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      margin-top: 18px;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      color: #888;
      margin-top: 25px;
      line-height: 1.7;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 28px 22px;
      }
    }
  </style>
</head>

<body>

  <main class="login-container">

    <header>
      <img
        src="images/nuur-elites-logo.png"
        alt="Nuur Elites Logo"
        class="logo"
      >

      <h1>NUUR ELITES</h1>

      <strong>LEARNING AND CONSULTANCY</strong>

      <p>Knowledge. Guidance. Impact.</p>

      <span class="admin-label">ADMINISTRATOR PORTAL</span>

      <p>Sign in to access the management dashboard.</p>
    </header>

    <form id="adminLoginForm">

      <label for="adminEmail">Administrator Email</label>

      <input
        type="email"
        id="adminEmail"
        placeholder="Enter your admin email"
        autocomplete="username"
        required
      >

      <label for="adminPassword">Password</label>

      <input
        type="password"
        id="adminPassword"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        Sign In
      </button>

      <p id="loginMessage" role="status"></p>

    </form>

    <div class="footer">
      <p>NUUR ELITES LEARNING AND CONSULTANCY</p>
      <p>Authorised administrators only.</p>
      <p>nuurelites@gmail.com</p>
    </div>

  </main>

  <script type="module" src="admin.js"></script>

</body>
</html>
