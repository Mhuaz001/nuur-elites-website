
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Nuur Elites</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    h2 {
      color: #155b37;
      text-align: center;
    }

    p {
      color: #657269;
      line-height: 1.5;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      background: #155b37;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>Nuur Elites</h2>
    <p>Administrator Password Reset</p>

    <form id="resetForm">
      <input
        type="password"
        id="newPassword"
        placeholder="Enter new password"
        minlength="8"
        required
      >

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm new password"
        minlength="8"
        required
      >

      <button type="submit" id="resetButton">
        Update Password
      </button>
    </form>

    <p id="message"></p>
  </div>

  <script type="module">
    import { createClient } from
      'https://esm.sh/@supabase/supabase-js@2';

    const supabase = createClient(
      'https://lrcnworfhrrntdltzgpe.supabase.co',
      'sb_publishable_yBLxiC7z_ZymMMveeQN9Ug_Bok2ubsZ'
    );

    const form = document.getElementById('resetForm');
    const message = document.getElementById('message');
    const button = document.getElementById('resetButton');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const password = document.getElementById('newPassword').value;
      const confirmPassword =
        document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        message.textContent = 'Your passwords do not match.';
        message.style.color = 'red';
        return;
      }

      button.disabled = true;
      button.textContent = 'Updating...';

      try {
        const { data, error } = await supabase.auth.updateUser({
          password: password
        });

        if (error) throw error;

        if (!data.user) {
          throw new Error('Password update could not be confirmed.');
        }

        message.textContent =
          'Password updated successfully. You can now sign in.';
        message.style.color = 'green';
        form.reset();

      } catch (error) {
        console.error(error);
        message.textContent =
          'Password reset failed. Please request a new recovery link.';
        message.style.color = 'red';

      } finally {
        button.disabled = false;
        button.textContent = 'Update Password';
      }
    });
  </script>

</body>
</html>
